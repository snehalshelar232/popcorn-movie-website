<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Favorites - Popcorn</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <a href="index.html" class="logo">
            POPCORN
        </a>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="index.html">Movies</a>
            </li>

            <li>
                <a href="favorites.html">❤️ Favorites</a>
            </li>
            <li>
            <button id="theme-toggle" class="theme-toggle" title="Change theme"> ☀️
            </button>
</li>

        </ul>

    </nav>


    <!-- FAVORITES HERO -->

    <section class="favorites-hero">

        <div class="favorites-hero-content">

            <div class="favorites-badge">
                ❤️ YOUR COLLECTION
            </div>

            <h1>
                My <span>Favorites</span>
            </h1>

            <p>
                The movies you love, all in one place.
                Your personal collection is waiting for you.
            </p>

            <a href="index.html" class="explore-btn">
                🎬 Explore Movies
            </a>

        </div>

    </section>


    <!-- FAVORITES -->

    <main class="movies-section favorites-movies">

        <div class="section-heading">

            <div>

                <h2>
                    Saved Movies
                </h2>

                <p class="favorites-subtitle">
                    Your personal movie collection ❤️
                </p>

            </div>

            <span
                id="favorite-count"
                class="favorite-count">
                0 movies
            </span>

        </div>


        <div
            class="movie-container"
            id="favorites-container">
        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Popcorn. Made as a college project.
        </p>

    </footer>


     <script src="./favorites.js"></script>

</body>

</html>
